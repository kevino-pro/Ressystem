name: Herinneringsmails (dag voor het bezoek)

on:
  schedule:
    # 08:00 en 09:00 UTC: een van de twee is altijd 10:00 in Nederland (winter- en zomertijd).
    # De app verstuurt pas vanaf het uur in [herinnering] en elke herinnering maar een keer.
    - cron: '0 8,9 * * *'
  workflow_dispatch: {}  # handmatig starten om te testen

permissions:
  contents: read

jobs:
  # Leest installaties.json: per installatie de NAMEN van de GitHub-variabelen en het secret (nooit de waarden).
  lijst:
    runs-on: ubuntu-latest
    outputs:
      installaties: ${{ steps.lees.outputs.installaties }}
    steps:
      - uses: actions/checkout@v4
      - id: lees
        run: echo "installaties=$(jq -c . installaties.json)" >> "$GITHUB_OUTPUT"

  herinneringen:
    name: herinneringen (${{ matrix.installatie.naam }})
    needs: lijst
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # een storing bij de ene installatie houdt de andere niet tegen
      matrix:
        installatie: ${{ fromJSON(needs.lijst.outputs.installaties) }}
    env:
      APP_URL: ${{ vars[matrix.installatie.app_url] }}
      BEHEER_API_KEY: ${{ secrets[matrix.installatie.beheer_sleutel] }}
      URL_NAAM: ${{ matrix.installatie.app_url }}
      SLEUTEL_NAAM: ${{ matrix.installatie.beheer_sleutel }}
    steps:
      - name: Herinneringen voor morgen versturen
        run: |
          test -n "$APP_URL" || { echo "Repository variable $URL_NAAM ontbreekt"; exit 1; }
          test -n "$BEHEER_API_KEY" || { echo "Repository secret $SLEUTEL_NAAM ontbreekt"; exit 1; }
          mislukt=0
          # Per aanroep verstuurt de app een beperkt aantal; zolang er iets resteert, opnieuw (hoogstens 5 keer).
          for poging in 1 2 3 4 5; do
            antwoord=$(curl -sf --max-time 60 --retry 3 --retry-delay 20 --retry-all-errors \
              -X POST -H "X-Beheer-Key: $BEHEER_API_KEY" "${APP_URL%/}/beheer/herinneringen")
            echo "$antwoord"
            mislukt=$((mislukt + $(echo "$antwoord" | jq -r '.mislukt')))
            [ "$(echo "$antwoord" | jq -r '.resterend')" -gt 0 ] || break
          done
          # Mislukte mails laten de taak falen, zodat GitHub je een melding stuurt.
          [ "$mislukt" -eq 0 ] || { echo "$mislukt herinnering(en) mislukt; zie de logs op Render (MAIL_FAILED)."; exit 1; }
