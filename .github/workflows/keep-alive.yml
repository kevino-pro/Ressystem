name: Keep Neon Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Elke 10 minuten
  workflow_dispatch: {}  # Handmatig testen zonder te wachten op cron

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint (met DB-round-trip)
        run: |
          curl -sf --max-time 10 --retry 2 --retry-delay 3 \
            https://restaurant-reservation-ai.onrender.com/health
