name: Keep Neon Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Elke 10 minuten
  workflow_dispatch: {}  # Handmatig testen zonder te wachten op cron

permissions:
  contents: read

jobs:
  # Eén job voor alle installaties (geen matrix), zodat dit elke 10 minuten maar één job kost.
  ping:
    runs-on: ubuntu-latest
    env:
      # Alleen variables, geen secrets: de health-URL's zijn niet geheim.
      ALLE_VARIABELEN: ${{ toJSON(vars) }}
    steps:
      - uses: actions/checkout@v4
      - name: Ping health endpoints (met DB-round-trip)
        run: |
          fout=0
          for naam in $(jq -r '.[].health_url' installaties.json); do
            url=$(echo "$ALLE_VARIABELEN" | jq -r --arg n "$naam" '.[$n] // empty')
            if [ -z "$url" ]; then echo "Repository variable $naam ontbreekt"; fout=1; continue; fi
            curl -sf --max-time 10 --retry 2 --retry-delay 3 "$url" || { echo "$naam gaf geen antwoord"; fout=1; }
            echo
          done
          exit $fout
