name: Keep Neon Alive

on:
  schedule:
    - cron: '*/10 * * * *'  # Elke 10 minuten
  workflow_dispatch: {}  # Handmatig testen zonder te wachten op cron

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
    steps:
      - name: Ping health endpoint (met DB-round-trip)
        run: |
          test -n "$RENDER_HEALTH_URL" || { echo "RENDER_HEALTH_URL repository variable ontbreekt"; exit 1; }
          curl -sf --max-time 10 --retry 2 --retry-delay 3 \
            "$RENDER_HEALTH_URL"
