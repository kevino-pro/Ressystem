name: Render deployment health

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: render-deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Leest installaties.json: per installatie de NAMEN van de GitHub-variabelen en het secret (nooit de waarden).
  lijst:
    runs-on: ubuntu-latest
    outputs:
      installaties: ${{ steps.lees.outputs.installaties }}
    steps:
      - uses: actions/checkout@v4
      - id: lees
        run: echo "installaties=$(jq -c . installaties.json)" >> "$GITHUB_OUTPUT"

  verify-render:
    name: verify-render (${{ matrix.installatie.naam }})
    needs: lijst
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false  # een storing bij de ene installatie houdt de andere niet tegen
      matrix:
        installatie: ${{ fromJSON(needs.lijst.outputs.installaties) }}
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}  # één API-key voor het hele Render-account
      RENDER_SERVICE_ID: ${{ vars[matrix.installatie.service_id] }}
      RENDER_HEALTH_URL: ${{ vars[matrix.installatie.health_url] }}
      SERVICE_NAAM: ${{ matrix.installatie.service_id }}
      HEALTH_NAAM: ${{ matrix.installatie.health_url }}
    steps:
      - name: Validate required deployment settings
        run: |
          test -n "$RENDER_API_KEY" || { echo "RENDER_API_KEY secret ontbreekt"; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "$SERVICE_NAAM repository variable ontbreekt"; exit 1; }
          test -n "$RENDER_HEALTH_URL" || { echo "$HEALTH_NAAM repository variable ontbreekt"; exit 1; }

      - name: Wait for matching Render deployment
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 1200))
          deployment_live=false
          deploys_bestand=$(mktemp)

          while (( SECONDS < deadline )); do
            if ! http_status=$(curl --silent --show-error --output "$deploys_bestand" --write-out '%{http_code}' \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20"); then
              echo "::error::Render API niet bereikbaar (curl-fout, geen HTTP-antwoord)."
              exit 1
            fi

            if [[ "$http_status" != "200" ]]; then
              echo "::error::Render API antwoordde met HTTP $http_status voor RENDER_SERVICE_ID."
              echo "Respons: $(head -c 500 "$deploys_bestand")"
              echo "Diagnose: 401 of 403 betekent RENDER_API_KEY ongeldig of zonder rechten; 404 betekent RENDER_SERVICE_ID ongeldig."
              exit 1
            fi

            deploys=$(cat "$deploys_bestand")
            deploy=$(jq -c --arg commit "$EXPECTED_COMMIT" \
              '[.[] | .deploy | select(.commit.id == $commit)] | first // empty' <<< "$deploys")

            if [[ -z "$deploy" ]]; then
              echo "Nog geen Render-deploy gevonden voor commit $EXPECTED_COMMIT."
              sleep 15
              continue
            fi

            status=$(jq -r '.status' <<< "$deploy")
            echo "Render deployment status: $status"

            case "$status" in
              live)
                deployment_live=true
                break
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Render deployment eindigde met status $status"
                exit 1
                ;;
              *)
                sleep 15
                ;;
            esac
          done

          if [[ "$deployment_live" != true ]]; then
            echo "::error::Timeout bij wachten op de Render-deploy voor $EXPECTED_COMMIT"
            exit 1
          fi

      - name: Verify deployed health endpoint
        run: curl --fail --silent --show-error --max-time 10 --retry 10 --retry-delay 5 --retry-all-errors "$RENDER_HEALTH_URL"