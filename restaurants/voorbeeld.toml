# Voorbeeldconfiguratie voor een restaurant. Kopieer dit bestand naar restaurants/<naam>.toml
# en zet RESTAURANT_CONFIG=restaurants/<naam>.toml in Render.

# Naam, e-mail en telefoon in de kop, de voet, de mails en de agenda. Verplicht als APP_ENV=production.
[restaurant]
naam = "Mijn Restaurant"
email = "info@restaurant.nl"
telefoon = "0612345678"

[reserveringen]
tijdzone = "Europe/Amsterdam"
slot_minuten = 15              # gasten kiezen een tijd per 15 minuten
zitduur_minuten = 120          # zo lang telt een reservering mee voor de capaciteit
max_gasten_tegelijk = 40       # maximaal aantal gasten dat tegelijk aan tafel zit
max_personen_per_boeking = 8   # grotere groepen bellen het restaurant
min_minuten_vooraf = 60        # niet later dan een uur van tevoren online reserveren
wijzigen_minuten_vooraf = 120  # optioneel: de gast kan zelf wijzigen tot zoveel minuten van tevoren
max_dagen_vooruit = 90
sluitingsdagen = [2026-12-25, 2027-01-01]
knop_minuten = 30              # optioneel: knoppen per half uur in het formulier (standaard = slot_minuten)
diner_vanaf = "17:00"          # optioneel: vanaf deze tijd staan de knoppen onder "Diner"
kinderstoelen = 0              # optioneel: aantal kinderstoelen in het restaurant (0 = niet vragen)
vraag_allergieen = false       # optioneel: vraag naar allergieën (met toestemming, gewist na het bezoek)

# Per weekdag de vensters waarin een reservering mag BEGINNEN. Lege lijst = gesloten.
[reserveringen.openingstijden]
maandag = []
dinsdag = [["17:00", "20:30"]]
woensdag = [["17:00", "20:30"]]
donderdag = [["17:00", "20:30"]]
vrijdag = [["17:00", "21:00"]]
zaterdag = [["12:00", "14:30"], ["17:00", "21:00"]]
zondag = [["12:00", "20:00"]]

# Gegevens voor de privacyverklaring (/privacy). Verplicht als APP_ENV=production.
# Pas de verwerkers aan als deze installatie andere diensten gebruikt.
[privacy]
verantwoordelijke = "Voorbeeldrestaurant B.V."
adres = "Voorbeeldstraat 1, 1234 AB Voorbeeldstad"
kvk = "12345678"                 # optioneel
bijgewerkt = 2026-11-06
verwerkers = [
    { naam = "Render", doel = "hosting van de reserveringswebsite", locatie = "Europese Unie" },
    { naam = "Neon", doel = "opslag van de reserveringen (database)", locatie = "Europese Unie" },
    { naam = "Resend", doel = "versturen van de bevestigingsmail", locatie = "Verenigde Staten" },
]

# Huisstijl (optioneel). Zonder deze sectie: goudkleurig accent en geen foto.
[huisstijl]
accentkleur = "#d9a441"                 # kleur van knoppen en gekozen tijden, als #rrggbb
ondertitel = "Voorbeeldstraat 1, Voorbeeldstad"
# achtergrond = "restaurants/voorbeeld/achtergrond.webp"   # pad binnen static/

# Herinneringsmail de dag voor het bezoek (optioneel). Zonder deze sectie gaan er geen herinneringen uit.
# Een geplande taak roept /beheer/herinneringen aan; zie .github/workflows/herinneringen.yml.
[herinnering]
uur = 10                                # vanaf dit uur, in de tijdzone van het restaurant
