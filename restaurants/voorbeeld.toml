# Voorbeeldconfiguratie voor een restaurant. Kopieer dit bestand naar restaurants/<naam>.toml
# en zet RESTAURANT_CONFIG=restaurants/<naam>.toml in Render.

[reserveringen]
tijdzone = "Europe/Amsterdam"
slot_minuten = 15              # gasten kiezen een tijd per 15 minuten
zitduur_minuten = 120          # zo lang telt een reservering mee voor de capaciteit
max_gasten_tegelijk = 40       # maximaal aantal gasten dat tegelijk aan tafel zit
max_personen_per_boeking = 8   # grotere groepen bellen het restaurant
min_minuten_vooraf = 60        # niet later dan een uur van tevoren online reserveren
max_dagen_vooruit = 90
sluitingsdagen = [2026-12-25, 2027-01-01]

# Per weekdag de vensters waarin een reservering mag BEGINNEN. Lege lijst = gesloten.
[reserveringen.openingstijden]
maandag = []
dinsdag = [["17:00", "20:30"]]
woensdag = [["17:00", "20:30"]]
donderdag = [["17:00", "20:30"]]
vrijdag = [["17:00", "21:00"]]
zaterdag = [["12:00", "14:30"], ["17:00", "21:00"]]
zondag = [["12:00", "20:00"]]
