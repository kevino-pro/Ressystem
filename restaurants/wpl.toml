# Waroeng Padang Lapek, vestiging Den Haag (Schoolstraat 35).
# Render: RESTAURANT_CONFIG=restaurants/wpl.toml

[reserveringen]
tijdzone = "Europe/Amsterdam"
slot_minuten = 15              # gasten kiezen een tijd per 15 minuten
zitduur_minuten = 60           # elke groep heeft een uur
max_gasten_tegelijk = 69       # zitplaatsen in Den Haag
max_personen_per_boeking = 15  # grotere groepen bellen en bestellen vooraf
min_minuten_vooraf = 60        # niet later dan een uur van tevoren online reserveren
max_dagen_vooruit = 90
sluitingsdagen = []            # nog geen vaste sluitingsdagen
knop_minuten = 30              # het formulier toont knoppen per half uur (12:00, 12:30, ...)
diner_vanaf = "16:00"          # knoppen vanaf 16:00 staan onder "Diner"
kinderstoelen = 2              # zoveel kinderstoelen heeft het restaurant in totaal

# Open di t/m zo 12:00-21:00. Met 60 minuten zitduur is 20:00 de laatste begintijd.
[reserveringen.openingstijden]
maandag = []
dinsdag = [["12:00", "20:00"]]
woensdag = [["12:00", "20:00"]]
donderdag = [["12:00", "20:00"]]
vrijdag = [["12:00", "20:00"]]
zaterdag = [["12:00", "20:00"]]
zondag = [["12:00", "20:00"]]

# Plattegrond voor het personeel (alleen zichtbaar na inloggen). Raster van 19 kolommen bij
# 10 rijen; kolom en rij tellen vanaf 0 linksboven. Breedte en hoogte zijn in hokjes.
[plattegrond]
kolommen = 19
rijen = 10
# Tafels die vaak aan elkaar geschoven worden.
combinaties = [
    ["1a", "1b", "1c", "1d", "1e"],
    ["3a", "3b"],
    ["5a", "5b"],
    ["6a", "6b"],
    ["7a", "7b"],
    ["10a", "10b"],
]
tafels = [
    # Bankje langs de achterwand
    { nummer = "1a", stoelen = 4, kolom = 0, rij = 0, breedte = 2, hoogte = 2 },
    { nummer = "1b", stoelen = 4, kolom = 2, rij = 0, breedte = 2, hoogte = 2 },
    { nummer = "1c", stoelen = 4, kolom = 4, rij = 0, breedte = 2, hoogte = 2 },
    { nummer = "1d", stoelen = 4, kolom = 6, rij = 0, breedte = 2, hoogte = 2 },
    { nummer = "1e", stoelen = 4, kolom = 8, rij = 0, breedte = 2, hoogte = 2 },
    { nummer = "2", stoelen = 6, kolom = 11, rij = 0, breedte = 3, hoogte = 2, vorm = "rond" },
    { nummer = "3a", stoelen = 4, kolom = 15, rij = 0, breedte = 2, hoogte = 2 },
    { nummer = "3b", stoelen = 4, kolom = 17, rij = 0, breedte = 2, hoogte = 2 },
    # Middenrij, tussen de palen
    { nummer = "8", stoelen = 2, kolom = 3, rij = 3 },
    { nummer = "7b", stoelen = 2, kolom = 5, rij = 3 },
    { nummer = "7a", stoelen = 2, kolom = 6, rij = 3 },
    { nummer = "6b", stoelen = 2, kolom = 9, rij = 3 },
    { nummer = "6a", stoelen = 2, kolom = 10, rij = 3 },
    { nummer = "5b", stoelen = 2, kolom = 13, rij = 3 },
    { nummer = "5a", stoelen = 2, kolom = 14, rij = 3 },
    { nummer = "4", stoelen = 4, kolom = 16, rij = 3, breedte = 2 },
    # Bij de ingang
    { nummer = "9", stoelen = 4, kolom = 0, rij = 5, breedte = 2, hoogte = 2 },
    { nummer = "10a", stoelen = 3, kolom = 2, rij = 5, breedte = 2, hoogte = 2 },
    { nummer = "10b", stoelen = 3, kolom = 4, rij = 5, breedte = 2, hoogte = 2 },
    # Voor de bar
    { nummer = "11", stoelen = 2, kolom = 8, rij = 6, breedte = 2 },
    { nummer = "12", stoelen = 2, kolom = 12, rij = 6, breedte = 2 },
    { nummer = "13", stoelen = 2, kolom = 15, rij = 6, breedte = 2 },
]
elementen = [
    { naam = "Meterkast", kolom = 0, rij = 3, breedte = 3 },
    { naam = "Paal", kolom = 8, rij = 3 },
    { naam = "Paal", kolom = 12, rij = 3 },
    { naam = "Paal", kolom = 15, rij = 3 },
    { naam = "Bar", kolom = 7, rij = 8, breedte = 12, hoogte = 2 },
    { naam = "Ingang", kolom = 0, rij = 8, hoogte = 2 },
