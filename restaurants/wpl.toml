# Gegevens voor de privacyverklaring (/privacy). Controleer de locaties in de dashboards van
# Render, Neon en n8n voordat je dit merget; de verklaring is een belofte aan je gasten.
[privacy]
verantwoordelijke = "Waroeng Padang Lapek"
adres = "Schoolstraat 35, 2511 AW Den Haag"
bijgewerkt = 2026-11-06
verwerkers = [
    { naam = "Render", doel = "hosting van de reserveringswebsite", locatie = "Europese Unie" },
    { naam = "Neon", doel = "opslag van de reserveringen (database)", locatie = "Europese Unie" },
    { naam = "Resend", doel = "versturen van de bevestigingsmail", locatie = "Verenigde Staten" },
    { naam = "n8n", doel = "doorsturen van reserveringen die als bericht binnenkomen", locatie = "Europese Unie" },
    { naam = "Anthropic", doel = "omzetten van een bericht naar een reservering (alleen bij reserveren via een bericht)", locatie = "Verenigde Staten" },
]

# Huisstijl van de website. De achtergrondfoto zet je in static/restaurants/wpl/ en noem je hier,
# bijvoorbeeld achtergrond = "restaurants/wpl/achtergrond.webp". Zonder foto: een warme donkere gloed.
[huisstijl]
accentkleur = "#d9a441"
ondertitel = "Schoolstraat 35, Den Haag"
