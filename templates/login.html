<!-- NAVBAR -->
<header class="bg-white shadow-sm border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">{{ config.RESTAURANT_NAAM }}</h1>
            <p class="text-xs text-slate-500 font-medium">{{ config.RESTAURANT_TAGLINE }}</p>
        </div>
        <a href="/" class="text-xs text-slate-500 hover:text-slate-700 transition">← Terug naar reserveren</a>
    </div>
</header>

<!-- MAIN CONTENT / LOGIN CARD -->
<main class="max-w-md mx-auto px-4 py-12 w-full flex-grow flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-md border border-slate-100 w-full">
        <div class="text-center mb-6">
            <h2 class="text-xl font-bold text-slate-900">Personeel Inloggen</h2>
            <p class="text-xs text-slate-500 mt-1">Toegang tot het reserveringenoverzicht</p>
        </div>

        <!-- FOUTMELDING BOX -->
        {% if foutmelding %}
        <div class="p-3 mb-4 rounded-lg text-xs font-medium bg-red-50 text-red-700 border border-red-200 text-center">
            {{ foutmelding }}
        </div>
        {% endif %}

        <form method="POST" action="/login" class="space-y-4">
            <div>
                <label for="gebruikersnaam"
                    class="block text-xs font-semibold text-slate-600 uppercase mb-1">Gebruikersnaam</label>
                <input type="text" id="gebruikersnaam" name="gebruikersnaam" required autocomplete="username"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
            </div>

            <div>
                <label for="wachtwoord"
                    class="block text-xs font-semibold text-slate-600 uppercase mb-1">Wachtwoord</label>
                <input type="password" id="wachtwoord" name="wachtwoord" required autocomplete="current-password"
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-slate-400">
            </div>

            <button type="submit"
                class="w-full py-3 px-4 bg-brand text-white font-medium text-sm rounded-lg shadow hover:opacity-90 transition duration-150 ease-in-out mt-2">
                Inloggen
            </button>
        </form>
    </div>
</main>

<!-- FOOTER -->
<footer class="bg-slate-100 border-t border-slate-200 py-6 text-center text-xs text-slate-500">
    <p class="mb-1">&copy; {{ config.RESTAURANT_NAAM }} — Beheerdersomgeving.</p>
</footer>
