"Reserveer je via een bericht, dan ook de tekst van dat bericht." = "If you book by message, also the text of that message."
"Je IP-adres, kort en alleen in het geheugen van de server, om misbruik van het formulier tegen te gaan. Het wordt niet opgeslagen." = "Your IP address, briefly and only in the server's memory, to prevent misuse of the form. It is not stored."
