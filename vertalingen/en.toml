"Waarvoor?" = "What for?"
"Alleen om je reservering vast te leggen, je een bevestiging met annuleerlink te sturen en contact op te nemen als er iets verandert. Dat is nodig om de reservering uit te voeren (artikel 6 lid 1 onder b AVG). Wij gebruiken je gegevens niet voor reclame en verkopen ze niet." = "Only to record your booking, send you a confirmation with a cancellation link and contact you if anything changes. This is necessary to carry out the booking (Article 6(1)(b) GDPR). We do not use your details for advertising and do not sell them."
"De dag voor je bezoek sturen we je een herinnering per e-mail, in de taal waarin je reserveerde." = "The day before your visit we send you a reminder by email, in the language you booked in."
"Allergieën zijn gezondheidsgegevens. Die bewaren we alleen als je daar bij het reserveren apart toestemming voor geeft (artikel 9 lid 2 onder a AVG), zodat de keuken rekening met je kan houden. Alleen ons personeel ziet ze; ze staan niet in de bevestigingsmail. Je kunt je toestemming altijd intrekken door ons te mailen of te bellen, dan wissen we ze meteen. Liever niet online? Geef het dan bij aankomst aan ons door." = "Allergies are health data. We only keep them if you give separate consent when booking (Article 9(2)(a) GDPR), so the kitchen can take them into account. Only our staff can see them; they are not in the confirmation email. You can withdraw your consent at any time by emailing or calling us, and we will delete them straight away. Rather not share them online? Then tell us when you arrive."
"Hoe lang bewaren wij ze?" = "How long do we keep them?"
"Tot {bewaartermijn} na de datum van je reservering. Daarna worden ze elke nacht automatisch en definitief verwijderd. Annuleer je, dan verwijderen wij je reservering direct." = "Until {bewaartermijn} after the date of your booking. After that they are deleted automatically and permanently, every night. If you cancel, we delete your booking immediately."
"Allergieën wissen we al eerder: in de nacht na je bezoek." = "Allergies are deleted sooner: in the night after your visit."
"Wie helpen ons daarbij?" = "Who helps us with this?"
"Deze partijen verwerken gegevens in onze opdracht, alleen voor het genoemde doel:" = "These parties process data on our behalf, only for the stated purpose:"
