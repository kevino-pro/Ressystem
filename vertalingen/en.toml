"Waarvoor" = "Purpose"
"Waar" = "Where"
"Gaan gegevens naar een land buiten de Europese Unie, dan gebeurt dat alleen met de waarborgen die de AVG daarvoor vraagt, zoals de standaardcontractbepalingen van de Europese Commissie." = "If data goes to a country outside the European Union, this only happens with the safeguards the GDPR requires, such as the European Commission's standard contractual clauses."
"Cookies" = "Cookies"
"Wij gebruiken één functionele cookie die nodig is om het formulier veilig te versturen, om je net gemaakte reservering te tonen en om personeel ingelogd te houden. Geen tracking- of advertentiecookies, en de opmaak van de site komt van onze eigen server." = "We use one functional cookie that is needed to send the form securely, to show the booking you have just made and to keep staff logged in. No tracking or advertising cookies, and the site's styling comes from our own server."
"Kies je rechtsboven een taal, dan onthoudt een tweede functionele cookie die keuze een jaar lang. Er staat alleen de taalcode in." = "If you choose a language at the top right, a second functional cookie remembers that choice for one year. It contains only the language code."
"Jouw rechten" = "Your rights"
"Je mag je gegevens inzien, laten verbeteren of laten verwijderen, en bezwaar maken tegen het gebruik ervan. Mail daarvoor naar {email}. Wij reageren binnen een maand. Ben je het niet eens met hoe wij met je gegevens omgaan, dan kun je een klacht indienen bij de {toezichthouder}." = "You may view, correct or delete your details, and object to their use. To do so, email {email}. We respond within one month. If you disagree with how we handle your details, you can file a complaint with the Dutch Data Protection Authority, the {toezichthouder}."
"← Terug naar het reserveringsformulier" = "← Back to the booking form"

