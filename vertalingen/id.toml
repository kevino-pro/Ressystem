"Alleen om je reservering vast te leggen, je een bevestiging met annuleerlink te sturen en contact op te nemen als er iets verandert. Dat is nodig om de reservering uit te voeren (artikel 6 lid 1 onder b AVG). Wij gebruiken je gegevens niet voor reclame en verkopen ze niet." = "Hanya untuk mencatat reservasi Anda, mengirimkan konfirmasi dengan tautan pembatalan, dan menghubungi Anda jika ada perubahan. Ini diperlukan untuk melaksanakan reservasi (Pasal 6 ayat 1 huruf b GDPR). Kami tidak menggunakan data Anda untuk iklan dan tidak menjualnya."
"De dag voor je bezoek sturen we je een herinnering per e-mail, in de taal waarin je reserveerde." = "Sehari sebelum kunjungan Anda, kami mengirimkan pengingat melalui email dalam bahasa yang Anda gunakan saat reservasi."
"Allergieën zijn gezondheidsgegevens. Die bewaren we alleen als je daar bij het reserveren apart toestemming voor geeft (artikel 9 lid 2 onder a AVG), zodat de keuken rekening met je kan houden. Alleen ons personeel ziet ze; ze staan niet in de bevestigingsmail. Je kunt je toestemming altijd intrekken door ons te mailen of te bellen, dan wissen we ze meteen. Liever niet online? Geef het dan bij aankomst aan ons door." = "Alergi termasuk data kesehatan. Kami hanya menyimpannya jika Anda memberikan persetujuan terpisah saat reservasi (Pasal 9 ayat 2 huruf a GDPR), agar dapur bisa memperhatikannya. Hanya staf kami yang dapat melihatnya; data ini tidak dicantumkan dalam email konfirmasi. Anda dapat menarik persetujuan kapan saja dengan mengirim email atau menelepon kami, lalu kami langsung menghapusnya. Lebih suka tidak secara online? Sampaikan saja kepada kami saat Anda datang."
"Hoe lang bewaren wij ze?" = "Berapa lama kami menyimpannya?"
"Tot {bewaartermijn} na de datum van je reservering. Daarna worden ze elke nacht automatisch en definitief verwijderd. Annuleer je, dan verwijderen wij je reservering direct." = "Sampai {bewaartermijn} setelah tanggal reservasi Anda. Setelah itu data dihapus secara otomatis dan permanen setiap malam. Jika Anda membatalkan, kami langsung menghapus reservasi Anda."
"Allergieën wissen we al eerder: in de nacht na je bezoek." = "Data alergi kami hapus lebih awal: pada malam setelah kunjungan Anda."
"Wie helpen ons daarbij?" = "Siapa yang membantu kami?"
"Deze partijen verwerken gegevens in onze opdracht, alleen voor het genoemde doel:" = "Pihak-pihak berikut memproses data atas nama kami, hanya untuk tujuan yang disebutkan:"
"Partij" = "Pihak"
"Waarvoor" = "Tujuan"
"Waar" = "Lokasi"
"Gaan gegevens naar een land buiten de Europese Unie, dan gebeurt dat alleen met de waarborgen die de AVG daarvoor vraagt, zoals de standaardcontractbepalingen van de Europese Commissie." = "Jika data dikirim ke negara di luar Uni Eropa, hal itu hanya dilakukan dengan perlindungan yang diwajibkan GDPR, seperti klausul kontrak standar dari Komisi Eropa."
"Cookies" = "Cookie"
"Wij gebruiken één functionele cookie die nodig is om het formulier veilig te versturen, om je net gemaakte reservering te tonen en om personeel ingelogd te houden. Geen tracking- of advertentiecookies, en de opmaak van de site komt van onze eigen server." = "Kami menggunakan satu cookie fungsional yang diperlukan untuk mengirim formulir dengan aman, menampilkan reservasi yang baru Anda buat, dan menjaga staf tetap masuk. Tidak ada cookie pelacak atau iklan, dan tampilan situs berasal dari server kami sendiri."
"Kies je rechtsboven een taal, dan onthoudt een tweede functionele cookie die keuze een jaar lang. Er staat alleen de taalcode in." = "Jika Anda memilih bahasa di kanan atas, cookie fungsional kedua akan mengingat pilihan itu selama satu tahun. Isinya hanya kode bahasa."
"Jouw rechten" = "Hak Anda"
"Je mag je gegevens inzien, laten verbeteren of laten verwijderen, en bezwaar maken tegen het gebruik ervan. Mail daarvoor naar {email}. Wij reageren binnen een maand. Ben je het niet eens met hoe wij met je gegevens omgaan, dan kun je een klacht indienen bij de {toezichthouder}." = "Anda berhak melihat, memperbaiki, atau menghapus data Anda, serta keberatan atas penggunaannya. Untuk itu, kirim email ke {email}. Kami akan menanggapi dalam waktu satu bulan. Jika Anda tidak setuju dengan cara kami menangani data Anda, Anda dapat mengajukan pengaduan ke otoritas perlindungan data Belanda, {toezichthouder}."
"← Terug naar het reserveringsformulier" = "← Kembali ke formulir reservasi"

